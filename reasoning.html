<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reasoning Agent | Fatima Iqbal</title>
    <meta name="description" content="Ask questions and let the agent decide tool execution dynamically.">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="cpu" style="color: #3b82f6;"></i>
                <span>Master AI Stack</span>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="agents.html" class="nav-item active">
                    <i data-lucide="bot"></i>
                    <span>AI Agents</span>
                </a>
                <a href="stack.html" class="nav-item">
                    <i data-lucide="layers"></i>
                    <span>AI Stack</span>
                </a>
                <a href="projects.html" class="nav-item">
                    <i data-lucide="folder-git-2"></i>
                    <span>Projects</span>
                </a>
                <a href="skills.html" class="nav-item">
                    <i data-lucide="sparkles"></i>
                    <span>Skills</span>
                </a>
                <a href="about.html" class="nav-item">
                    <i data-lucide="info"></i>
                    <span>About</span>
                </a>
            </nav>
        </aside>

        <div class="main-wrapper">

            <header class="top-header">
                <div style="font-weight: 600; font-size: 0.95rem; color: #94a3b8;">
                    Agents / <span style="color: #fff;">Reasoning Agent</span>
                </div>

                <div style="display: flex; align-items: center; gap: 16px;">
                    <span class="card-header-badge">
                        <span style="width: 6px; height: 6px; background: #3b82f6; border-radius: 50%;"></span>
                        Agent 02
                    </span>
                </div>
            </header>

            <main class="main-content">

                <div style="margin-bottom: 28px;">
                    <span style="color: #3b82f6; font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase;">Decision Logic</span>
                    <h1 style="font-family: var(--display); font-size: 2rem; margin-top: 4px; font-weight: 700;">Reasoning Agent 🧠</h1>
                    <p style="color: var(--muted); font-size: 0.92rem; margin-top: 6px;">
                        Ask a question and the agent dynamically evaluates whether external tools are needed.
                    </p>
                </div>

                <div class="card" style="max-width: 800px;">
                    <div style="margin-bottom: 20px;">
                        <label for="question" style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: #e2e8f0;">
                            Ask something
                        </label>
                        <input id="question" type="text" placeholder="Example: What is 245 × 12?" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;">
                    </div>

                    <div style="margin-bottom: 24px;">
                        <button class="btn btn-primary" id="askReasoningBtn" style="padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
                            <i data-lucide="sparkles" style="width: 18px; height: 18px;"></i>
                            Ask Agent
                        </button>
                    </div>

                    <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                        <div style="font-size: 0.8rem; font-family: var(--mono); color: var(--muted); text-transform: uppercase; margin-bottom: 8px;">
                            Output Result
                        </div>
                        <div class="result" id="reasoningResult" style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; border: 1px solid var(--border); min-height: 100px; color: #cbd5e1; font-size: 0.92rem; white-space: pre-wrap;">
                            Agent response will appear here.
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>

    <script>
        lucide.createIcons();

        document.getElementById("askReasoningBtn").addEventListener("click", async () => {
            const questionInput = document.getElementById("question");
            const question = questionInput.value.trim();
            const result = document.getElementById("reasoningResult");

            if (!question) {
                result.textContent = "Please enter a question.";
                return;
            }

            result.innerHTML = '<span style="color: #3b82f6;">Agent is thinking...</span>';

            try {
                const data = await askReasoning(question);
                
                // Parse response dynamic properties
                if (typeof data === "string") {
                    result.textContent = data;
                } else if (data.answer) {
                    result.textContent = data.answer;
                } else if (data.result) {
                    result.textContent = typeof data.result === "string" ? data.result : JSON.stringify(data.result, null, 2);
                } else {
                    result.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                console.error("API Call Exception:", error);
                result.textContent = `Error connecting to API (${error.message}). Ensure backend server is running at http://127.0.0.1:8000.`;
            }
        });
    </script>

</body>

</html>
