<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Agent | Fatima Iqbal</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main>

    <section class="page-hero">

        <div class="container">

            <span class="section-label">Agent 01</span>

            <h1>Project-to-Blog Agent</h1>

            <p>
                Turn your rough project notes into a polished
                technical blog post.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div class="form-box">

                <label for="blogNotes">
                    Tell me about your project
                </label>

                <textarea
                    id="blogNotes"
                    placeholder="Example: I built an AI chatbot using Python and the Groq API..."
                ></textarea>

                <div class="form-actions">

                    <button
                        class="btn btn-primary"
                        id="generateBlog">
                        ✨ Generate Blog
                    </button>

                </div>

                <div class="result" id="blogResult">
                    Your generated blog will appear here.
                </div>

            </div>

        </div>

    </section>

</main>

<script src="js/main.js"></script>
<script src="js/api.js"></script>

<script>

document.getElementById("generateBlog").addEventListener("click", async () => {

    const notes = document.getElementById("blogNotes").value.trim();
    const result = document.getElementById("blogResult");

    if (!notes) {
        result.textContent = "Please enter your project notes first.";
        return;
    }

    result.innerHTML = '<span class="loading">Generating blog...</span>';

    try {

        const data = await generateBlog(notes);

        result.textContent =
            data.blog ||
            data.content ||
            data.result ||
            JSON.stringify(data, null, 2);

    } catch (error) {

        result.textContent =
            "Unable to connect to the backend. Make sure FastAPI is running on port 8000.";

    }

});

</script>

</body>
</html>
