<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Assistant | Fatima Iqbal</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main>

    <section class="page-hero">

        <div class="container">

            <span class="section-label">Agent 03</span>

            <h1>Chat Assistant</h1>

            <p>
                Have a conversation with the AI assistant.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div class="chat-container">

                <div class="chat-header">

                    <h3>💬 AI Assistant</h3>

                    <p>
                        Powered by the Master AI Stack backend
                    </p>

                </div>


                <div
                    class="chat-messages"
                    id="chatMessages">

                    <div class="message ai">
                        Hello! How can I help you today?
                    </div>

                </div>


                <form class="chat-form" id="chatForm">

                    <input
                        id="chatInput"
                        type="text"
                        placeholder="Type your message..."
                        autocomplete="off"
                    >

                    <button
                        class="btn btn-primary"
                        type="submit">
                        Send
                    </button>

                </form>

            </div>

        </div>

    </section>

</main>

<script src="js/main.js"></script>
<script src="js/api.js"></script>

<script>

const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const chatMessages = document.getElementById("chatMessages");

let history = [];

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = `message ${type}`;

    message.textContent = text;

    chatMessages.appendChild(message);

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


chatForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const message = chatInput.value.trim();

    if (!message) return;

    addMessage(message, "user");

    chatInput.value = "";

    try {

        const data = await askChat(message, history);

        const reply =
            data.reply ||
            data.answer ||
            data.response ||
            data.result ||
            "I couldn't generate a response.";

        addMessage(reply, "ai");

        history.push({
            role: "user",
            content: message
        });

        history.push({
            role: "assistant",
            content: reply
        });

    } catch (error) {

        addMessage(
            "Backend connection failed. Please make sure FastAPI is running.",
            "ai"
        );

    }

});

</script>

</body>
</html>
